version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      # Still pulled in by cpal and the windows crates. This ignore dates from the Tauri days and is kept for now.
      - dependency-name: windows-core
  - package-ecosystem: pub
    directory: /ui_flutter
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
