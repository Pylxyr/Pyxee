name: ci
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - run: npm ci --prefix ui
      - run: npm run check --prefix ui
      - run: npm test --prefix ui
      - run: npm run build --prefix ui   # Tauri embeds ui/dist at compile time
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The TypeScript bindings are generated from the Rust types; they must be committed up to date.
      - run: git diff --exit-code ui/src/lib/bindings
