name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by cut-release.yml (before it bumps anything) and by release.yml (for a hand-pushed tag).
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Rust on Windows: the platform Pyxee ships on, with Windows-only dependencies. fmt runs only here.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci
      # The audio crate links a minimal static FFmpeg (in-process, no ffmpeg program): built once, then cached.
      - uses: ./.github/actions/ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The Flutter window (ui_flutter) around the Rust core. It needs the built bridge library (the native-assets hook
  # copies it in), so the bridge is built first. Analysis, tests when there are any, and a real Windows release build:
  # the same build the release workflow packages.
  flutter:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-flutter
      - uses: ./.github/actions/ffmpeg
      - run: cargo build -p pyxee-bridge --release --locked
      # The stable channel; ui_flutter/pubspec.yaml states the oldest Flutter and Dart it accepts.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Flutter packages
        working-directory: ui_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: ui_flutter
        run: flutter analyze
      - name: Tests
        if: ${{ hashFiles('ui_flutter/test/**') != '' }}
        working-directory: ui_flutter
        run: flutter test
      - name: Release build
        working-directory: ui_flutter
        run: flutter build windows --release

  # The Linux build: the whole workspace compiles, passes clippy and its tests on Linux too. The minimal
  # static FFmpeg is built here (about 10 minutes) and cached on the build script.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries (audio) and FFmpeg's build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config nasm make libasound2-dev
      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-linux
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: ffmpeg
        with:
          path: target/ffmpeg/x86_64-unknown-linux-gnu
          key: ffmpeg-linux-${{ hashFiles('scripts/build-ffmpeg.sh') }}
      - name: Build the minimal static FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: cargo xtask ffmpeg
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The release machinery is code too: it is tested on every change, and every file that carries the version must agree.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The app's yt-dlp format selector is checked against the real yt-dlp (the app downloads its latest release).
      - run: pip install yt-dlp
      - run: python -m unittest discover -s scripts/tests -v
        env:
          REQUIRE_YT_DLP: "1"
      - name: Version files agree
        run: python scripts/bump_version.py --check "v$(python scripts/bump_version.py --current)"

  # Known vulnerabilities in Rust dependencies (RustSec). Not blocking: the baseline has findings that need dependency
  # upgrades (listed in docs/development.md).
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        continue-on-error: true
        with:
          command: check advisories
          arguments: --locked

  # One required check for branch protection: it fails if any job above failed or was cancelled.
  ci-ok:
    if: always()
    needs: [windows, flutter, linux, scripts, deny]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
