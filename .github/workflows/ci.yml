name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by cut-release.yml (before it bumps anything) and by release.yml (for a hand-pushed tag).
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The UI on its own, on the fast Linux runner. The Rust job below builds the UI again because Tauri embeds ui/dist.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run check --prefix ui
      - run: npm test --prefix ui
      - run: npm run build --prefix ui

  # Windows is the only platform Pyxee ships on, and it has Windows-only dependencies, so Rust is checked there.
  rust:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui # Tauri embeds ui/dist at compile time
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # The TypeScript bindings are generated from the Rust types by the tests above; they must be committed up to date.
      - name: Generated bindings are committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- ui/src/lib/bindings)" ]; then
            git status --short -- ui/src/lib/bindings
            git diff -- ui/src/lib/bindings
            echo "::error::ui/src/lib/bindings is out of date. Run 'cargo test -p pyxee-app' and commit the result."
            exit 1
          fi
      # Code that could only be written, not compiled, where it was developed (see crates/app/Cargo.toml).
      # Reported, never blocking: when it starts passing, move it into the required steps.
      - name: win-extras compiles (informational)
        continue-on-error: true
        run: cargo check -p pyxee-app --features win-extras --locked

  # The release machinery is code too: it is tested on every change, and every file that carries the version must agree.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v
      - name: Version files agree
        run: python scripts/bump_version.py --check "v$(python scripts/bump_version.py --current)"

  # One required check for branch protection: it fails if any job above failed or was cancelled.
  ci-ok:
    if: always()
    needs: [ui, rust, scripts]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
