name: Release

# Builds the Windows installer and publishes a GitHub release. You normally never run this by hand:
# use "Cut release" (cut-release.yml). Other ways in:
#   - push a tag vX.Y.Z whose version matches every version file   -> checks, build, publish
#   - Run workflow here with a version                             -> dry run: builds, uploads artifacts, publishes nothing
#   - called by cut-release.yml with the tag it just pushed        -> build, publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: version to build, as in Cargo.toml (e.g. 0.2.0 or 0.2.0-rc1). Builds and uploads artifacts; publishes nothing."
        required: true
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v0.2.0"
        required: true
        type: string
      skip_checks:
        description: "The caller already ran CI on this code"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # inputs.tag is empty (the triggering ref) for a tag push or a dry run, and the new tag when called.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          CALLED_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$CALLED_TAG" ]; then TAG="$CALLED_TAG"
          elif [ "$EVENT" = "workflow_dispatch" ]; then TAG="v${INPUT_VERSION#v}"
          else TAG="$REF_NAME"; fi
          python scripts/bump_version.py --check "$TAG"
          # A hand-pushed tag must sit on main: releases are built from reviewed history only.
          if [ "$EVENT" = "push" ]; then
            git fetch --quiet origin main
            git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main. Releases are only cut from main."; exit 1; }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # The same checks as every pull request. Skipped when cut-release.yml has just run them.
  checks:
    needs: version-guard
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version-guard, checks]
    # `checks` may be skipped, but never failed or cancelled.
    if: ${{ !cancelled() && needs.version-guard.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
      - uses: ./.github/actions/ffmpeg # the audio crate's static libav (in-process; no ffmpeg program is bundled)
      # yt-dlp, checked against its published SHA-256 (nothing is used if it does not match).
      # Audio is decoded inside the app (libav, linked in), so yt-dlp is the only bundled tool: there is no ffmpeg program.
      - name: Download yt-dlp
        run: cargo xtask tools
      - name: Bundled tools run, and no ffmpeg is bundled
        shell: pwsh
        run: |
          $bin = "crates/app/binaries"
          & "$bin/yt-dlp-x86_64-pc-windows-msvc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp does not run" }
          $ff = @(Get-ChildItem $bin -Filter "ffmpeg*" -ErrorAction SilentlyContinue)
          if ($ff.Count -gt 0) { throw "ffmpeg was downloaded again: $($ff.Name -join ', ')" }
          # yt-dlp parses its --format argument on start-up, so a malformed selector kills every play before any
          # network call. Run the shipped binary with the app's real selector against a dead local port: it must
          # fail with an ordinary connection error, never with a selector error.
          $src = Get-Content crates/sources/src/ytdlp.rs -Raw
          if ($src -notmatch 'FORMAT_SELECTOR: &str =\s*"([^"]+)"') { throw "FORMAT_SELECTOR not found in ytdlp.rs" }
          $selector = $Matches[1]
          $ErrorActionPreference = "Continue"
          $out = & "$bin/yt-dlp-x86_64-pc-windows-msvc.exe" --ignore-config --no-warnings --socket-timeout 3 --retries 0 -f $selector --simulate "http://127.0.0.1:9/x" 2>&1 | Out-String
          $global:LASTEXITCODE = 0 # the connection error above is expected; only a selector error is a failure
          if ($out -match 'Invalid filter|SyntaxError|Traceback|Failed to execute script') { throw "yt-dlp rejects the app's format selector [$selector]:`n$out" }
          Write-Host "yt-dlp accepts the app's format selector: $selector"
      - run: npm ci --prefix ui
      - run: npm run build --prefix ui
      # Same as `cargo xtask installer`, with the bundle list chosen here: Windows Installer (MSI) only accepts a
      # numeric pre-release suffix, so a release candidate such as 0.2.0-rc1 gets the NSIS installer alone.
      - name: Build the installer
        working-directory: crates/app
        shell: pwsh
        run: |
          $bundles = if ($env:VERSION -match '-') { "nsis" } else { "nsis,msi" }
          & "$env:GITHUB_WORKSPACE/ui/node_modules/.bin/tauri.cmd" build --config tauri.bundle.conf.json --bundles $bundles
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }
      # Install the built installer for real, silently, and run what it installed. This proves the installed layout
      # (the app with yt-dlp next to it, and no ffmpeg) is what the app expects.
      - name: Installed layout works
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $dir = Join-Path $env:RUNNER_TEMP "pyxee-installed"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$dir" -Wait
          Get-ChildItem $dir -Recurse -Filter *.exe | ForEach-Object { "{0}: {1:N1} MB" -f $_.FullName.Substring($dir.Length), ($_.Length / 1MB) }
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch '^(uninstall|yt-dlp)' } | Select-Object -First 1
          if (-not $app) { throw "The app executable is missing from the installed folder" }
          if (-not (Test-Path (Join-Path $dir "yt-dlp.exe"))) { throw "Missing from the installed app: yt-dlp.exe" }
          # An ffmpeg program or a libav DLL. (FFmpeg-LGPL-2.1.txt, the licence text, is meant to be there.)
          $ffBinary = @(Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(ffmpeg|ffprobe|ffplay)\.exe$|^(avcodec|avformat|avutil|swresample)(-\d+)?\.dll$' })
          if ($ffBinary.Count -gt 0) { throw "an ffmpeg program or libav DLL is in the installed app, but libav is linked in statically: $($ffBinary.Name -join ', ')" }
          if (-not (Get-ChildItem $dir -Recurse -Filter "FFmpeg-LGPL-2.1.txt" -ErrorAction SilentlyContinue)) { throw "the installed app does not carry FFmpeg-LGPL-2.1.txt (the LGPL text must ship with it)" }
          & (Join-Path $dir "yt-dlp.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "The installed yt-dlp does not run" }
      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $files = @(Get-ChildItem "target/release/bundle/nsis/*-setup.exe")
          if ($env:VERSION -notmatch '-') { $files += @(Get-ChildItem "target/release/bundle/msi/*.msi") }
          if ($files.Count -eq 0) { throw "No installers were built" }
          foreach ($f in $files) {
            if ($f.Name -notlike "*$($env:VERSION)*") { throw "$($f.Name) does not carry version $($env:VERSION)" }
            Copy-Item $f.FullName release/
          }
          Copy-Item crates/app/licenses/THIRD_PARTY.txt release/THIRD_PARTY_NOTICES.txt
          Copy-Item crates/app/licenses/FFmpeg-LGPL-2.1.txt release/FFmpeg-LGPL-2.1.txt
          Get-ChildItem release | ForEach-Object { "{0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error

  publish:
    needs: [version-guard, build]
    # A tag push, or a call from cut-release.yml. A manual dry run has neither.
    # The explicit status check is required: without one GitHub applies an implicit success() over the whole
    # dependency chain, so the (deliberately) skipped `checks` job upstream of `build` would skip this job too,
    # silently, even though the build succeeded.
    if: ${{ !cancelled() && needs.version-guard.result == 'success' && needs.build.result == 'success' && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      models: read # lets the release-notes step use GitHub Models (free) with the built-in token
    env:
      TAG: ${{ needs.version-guard.outputs.tag }}
      VERSION: ${{ needs.version-guard.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows
          path: release
      - name: Checksums
        run: |
          cd release
          sha256sum $(ls | grep -E '\.(exe|msi)$') > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Needs a public repo, or GitHub Enterprise Cloud for a private one. Never blocks the release.
      - name: Attest build provenance
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.exe
            release/*.msi
      - name: Write release notes
        env:
          # AI release notes, tried in this order; with none available the notes come from commit messages and
          # a read of the code (scripts/release_notes.py).
          #  1. ANTHROPIC_API_KEY (optional secret)
          #  2. AI_API_KEY secret + AI_BASE_URL and AI_MODEL variables (any OpenAI-compatible service)
          #  3. GitHub Models, free, using the built-in token (needs `models: read` above)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes-header.md
            echo
            python3 scripts/release_notes.py --ai --tag "$TAG" --repo "$GITHUB_REPOSITORY" || {
              echo "::warning::Could not build the changelog; publishing without it." >&2
              echo "See the commit history for what changed."
            }
            echo
            echo "## About these builds"
            echo
            echo "The Windows installers are **not code-signed**, so SmartScreen will warn about them."
            if [ "${{ steps.attest.outcome }}" = "success" ]; then
              echo "Build provenance: verify with \`gh attestation verify <file> --repo ${GITHUB_REPOSITORY}\`."
            fi
          } > notes.md
          cat notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      # The release is created as a draft, filled, and only then made public, so nobody ever sees a half-uploaded
      # release. Safe to re-run: an existing release for the tag is updated instead of failing.
      - name: Create the GitHub release
        run: |
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "Pyxee ${VERSION}" --notes-file notes.md --draft=false "${flags[@]}"
          else
            gh release create "$TAG" release/* \
              --title "Pyxee ${VERSION}" \
              --notes-file notes.md \
              --verify-tag \
              --draft \
              "${flags[@]}"
            gh release edit "$TAG" --draft=false
          fi
          gh release view "$TAG" --json url --jq .url
