[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2 = "0.11.1"
# Ed25519 for signing the release checksum list (the app verifies it with the same crate)
ring = "0.17.14"
# The portable zip (written here, so it is the same on every machine and tested on every platform)
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
# native-certs: trust the OS certificate store (antivirus HTTPS scanning, corporate proxies)
pyxee-net = { path = "../crates/net" }
ureq = "3.5.1"

[lints]
workspace = true
