[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2 = "0.10"
# native-certs: trust the OS certificate store (antivirus HTTPS scanning, corporate proxies)
ureq = { version = "2", features = ["native-certs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
