[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Build tasks for Pyxee (cargo xtask)"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
sha2.workspace = true
# Ed25519 for signing the release checksum list (the app verifies it with the same crate)
ring.workspace = true
serde_json.workspace = true
# The portable zip (written here, so it is the same on every machine and tested on every platform)
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
# native-certs: trust the OS certificate store (antivirus HTTPS scanning, corporate proxies)
pyxee-net.workspace = true
ureq.workspace = true

[lints]
workspace = true
