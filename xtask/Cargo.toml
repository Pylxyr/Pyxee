[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
sha2 = "0.10"
serde_json = "1"
# The portable zip (written here, so it is the same on every machine and tested on every platform)
zip = { version = "~2.4", default-features = false, features = ["deflate"] }
# native-certs: trust the OS certificate store (antivirus HTTPS scanning, corporate proxies)
ureq = { version = "2", features = ["native-certs"] }

[lints]
workspace = true
