# cargo-deny configuration: `cargo deny check` (the `deny` job in .github/workflows/ci.yml).
# Only what ships is judged: the Windows build the installer is made from.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Known vulnerabilities and unmaintained crates, from the RustSec database.
version = 2

[licenses]
version = 2
# Licences accepted for what ships, each with the reason (an unlisted licence fails the check until someone looks):
allow = [
    "MIT",
    "Apache-2.0",
    # BSD-3-Clause: permissive; brotli, alloc-no-stdlib, alloc-stdlib, subtle. Needs the notice kept (each
    # crate's own licence text is in its source).
    "BSD-3-Clause",
    # ISC: permissive, MIT-like; ring, rustls-webpki, untrusted (TLS for the update and metadata requests).
    "ISC",
    # Zlib: permissive; foldhash.
    "Zlib",
    # Unicode-3.0: permissive licence of the Unicode data and the ICU4X crates (idna/url handling) and unicode-ident.
    "Unicode-3.0",
    # CDLA-Permissive-2.0: the licence of the Mozilla CA list data in webpki-roots (the TLS root certificates).
    "CDLA-Permissive-2.0",
    # MPL-2.0: weak, file-level copyleft; cssparser, selectors, dtoa-short, option-ext (pulled in by Tauri's web
    # stack). Pyxee does not modify them; their source is public on crates.io, which is where MPL-2.0 points
    # for an unmodified redistribution.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
