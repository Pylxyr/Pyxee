# cargo-deny settings for `cargo deny --locked check advisories` (the `deny` job in .github/workflows/ci.yml).
#
# The job reads this file instead of cargo-deny's built-in defaults, which differ between cargo-deny versions: the
# action CI uses treated every unmaintained crate anywhere in the tree as an error, including ones that only arrive
# through Tauri (`proc-macro-error`), `lofty` (`paste`) and `souvlaki` (`zbus_names`, `zvariant`, `zvariant_derive`),
# none of which Pyxee can replace or upgrade itself.

[advisories]
version = 2

# An unmaintained crate fails the check only when a Pyxee crate depends on it directly, which is ours to change.
# A transitive one is reported by `cargo deny check advisories` with `unmaintained = "all"` and goes away when the crate
# that pulls it in moves. Known vulnerabilities (and anything else the advisory database marks as a problem) always fail.
unmaintained = "workspace"

# Every licence in the tree (Rust crates that are compiled into Pyxee, and the ones only used to build it) must be one of
# these. They are the permissive and weak-copyleft licences crates/app/licenses/THIRD_PARTY.txt names; a GPL or other strong-copyleft crate
# would turn up here instead of in a release. A crate that offers a choice (`MIT OR Apache-2.0 OR LGPL-2.1-or-later`,
# as `r-efi` does) passes when one of its options is listed. `cargo deny --locked list` shows what is in use.
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
]

# Crates come from crates.io (and the vendored souvlaki by path): a dependency on a git branch or another registry would
# be a change somebody should look at.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
