# cargo-about configuration, used by scripts/gen_dependency_notices.py to write the Rust half of
# crates/app/licenses/THIRD_PARTY_DEPENDENCIES.txt. Same licences as deny.toml (the reasons are there).
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# Only what the Windows installer ships.
targets = ["x86_64-pc-windows-msvc"]
# Pyxee's own crates (pyxee-*) show up in the MIT list: they are under the repository's MIT LICENSE.
ignore-build-dependencies = true
ignore-dev-dependencies = true
