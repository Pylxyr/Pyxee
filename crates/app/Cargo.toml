[package]
name = "pyxee-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pyxee desktop music player: the Tauri shell"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[dependencies]
log = { workspace = true, features = ["std"] }
pyxee-core.workspace = true
pyxee-audio.workspace = true
pyxee-library.workspace = true
pyxee-sources.workspace = true
pyxee-lyrics.workspace = true
pyxee-shell.workspace = true
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
serde.workspace = true
serde_json.workspace = true
pyxee-net.workspace = true
ureq.workspace = true
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
discord-rich-presence = "1.1.0"
md-5 = "0.11.0"
tauri-plugin-dialog = "2.8.4"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"
# Tells WebView2 when a window is hidden (shell/webview_power.rs). These are the versions Tauri itself uses, so the
# types are the same ones `with_webview` hands out.
webview2-com = "0.39.1"
windows-core = "0.62.2"

[features]
# Developer tools: the simulated engine with demo tracks (PYXEE_SIM), the performance log (PYXEE_PERF) and the seek-bar
# fill modes (PYXEE_SEEK_MODE). On in every debug build (`tauri dev`, `cargo test`); a release build has none of them
# unless it is built with this feature (e.g. for scripts/perf/measure.py, together with VITE_PYXEE_DEV_TOOLS=1 for the UI).
dev-tools = []

[dev-dependencies]
# The engine tests serve audio from a local `http` server, which the stream agent otherwise refuses.
pyxee-audio = { workspace = true, features = ["allow-insecure-http"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[lints]
workspace = true
