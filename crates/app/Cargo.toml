[package]
name = "pyxee-app"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
log = { version = "0.4.35", features = ["std"] }
pyxee-core = { path = "../core" }
pyxee-audio = { path = "../audio" }
pyxee-library = { path = "../library" }
pyxee-sources = { path = "../sources" }
pyxee-lyrics = { path = "../lyrics" }
pyxee-shell = { path = "../shell" }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pyxee-net = { path = "../net" }
ureq = "3.5.1"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
discord-rich-presence = "1.1.0"
md-5 = "0.11.0"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.1"
# Tells WebView2 when a window is hidden (shell/webview_power.rs). These are the versions Tauri itself uses, so the
# types are the same ones `with_webview` hands out.
webview2-com = "0.39.1"
windows-core = "0.62.2"
windows = { version = "0.62.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Storage_EnhancedStorage",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Taskbar thumbnail buttons and the jump list: raw Windows COM calls that could only be written, not compiled,
# where this was developed. Off by default so the normal build cannot break; try it with
#   cargo check -p pyxee-app --features win-extras
win-extras = ["dep:windows"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[lints]
workspace = true
