[package]
name = "pyxee-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pyxee_bridge"
crate-type = ["cdylib"]

[dependencies]
log = { version = "0.4.35", features = ["std"] }
pyxee-audio = { path = "../audio" }
pyxee-core = { path = "../core" }
pyxee-library = { path = "../library" }
pyxee-lyrics = { path = "../lyrics" }
pyxee-shell = { path = "../shell" }
pyxee-sources = { path = "../sources" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pyxee-net = { path = "../net" }
ureq = "3.5.1"
discord-rich-presence = "1.1.0"
# Media keys and the system transport tile: the vendored copy (see the root Cargo.toml).
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }

[lints]
workspace = true
