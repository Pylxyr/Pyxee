license.workspace = true

[lib]
name = "pyxee_bridge"
crate-type = ["cdylib"]

[dependencies]
pyxee-core = { path = "../core" }
pyxee-sources = { path = "../sources" }
serde = { version = "1.0.229", features = ["derive"] }
