[package]
name = "pyxee-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "In-process FFmpeg audio engine for Pyxee"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
log.workspace = true
rubato = "5.0.1"
thiserror.workspace = true
# native-certs: trust the OS certificate store (antivirus HTTPS scanning, corporate proxies)
pyxee-net.workspace = true
ureq.workspace = true
pyxee-core.workspace = true
cpal.workspace = true

[build-dependencies]
cc = "1.11.0"

[features]
# Lets the stream agent talk plain `http`, so the tests can serve audio from a local server. Never on in a normal
# build: the app turns it on only for its tests (a dev-dependency), and `cargo test -p pyxee-audio` on its own needs
# `--features allow-insecure-http`.
allow-insecure-http = []

[lints]
workspace = true
