[package]
name = "pyxee-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
symphonia = { version = "0.5", features = ["all"] }
rubato = "5.0"
thiserror = "2"
# native-certs: trust the OS certificate store (antivirus HTTPS scanning, corporate proxies)
ureq = { version = "2", features = ["native-certs"] }
pyxee-core = { path = "../core" }
cpal = "0.15"

[lints]
workspace = true
