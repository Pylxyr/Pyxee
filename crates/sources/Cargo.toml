[package]
name = "pyxee-sources"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# native-certs: trust the OS certificate store (antivirus HTTPS scanning, corporate proxies)
ureq = { version = "2", features = ["native-certs"] }

[lints]
workspace = true
