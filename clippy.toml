# clippy::cargo's `multiple_crate_versions`: these crates appear twice (or three times) in Cargo.lock because the
# dependencies we do not control (Tauri and its Linux/Windows stacks, zbus, html parsers, the RustCrypto family) ask for
# different versions of them. Nothing in this repository can merge them; the list is re-checked whenever `cargo update`
# changes it (a crate that no longer appears twice can be removed, a new one is reported by clippy).
allowed-duplicate-crates = [
    "base64",
    "bit-set",
    "bit-vec",
    "bitflags",
    "block-buffer",
    "cpufeatures",
    "crypto-common",
    "cssparser",
    "digest",
    "dirs",
    "dom_query",
    "getrandom",
    "hashbrown",
    "heck",
    "html5ever",
    "indexmap",
    "jiff-core",
    "jiff-static",
    "jiff-tzdb-platform",
    "jiff-tzdb",
    "jiff",
    "jni-sys",
    "jni",
    "markup5ever",
    "miniz_oxide",
    "phf_generator",
    "phf_macros",
    "phf_shared",
    "phf",
    "proc-macro-crate",
    "r-efi",
    "schemars",
    "selectors",
    "serde_spanned",
    "servo_arc",
    "sha2",
    "string_cache",
    "syn",
    "thiserror-impl",
    "thiserror",
    "toml_datetime",
    "toml_edit",
    "uuid",
    "web_atoms",
    "windows-sys",
    "windows-targets",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",
    "winnow",
    "zbus_macros",
    "zbus",
]
