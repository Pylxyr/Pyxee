name: pyxee_ui
description: Pyxee's Flutter shell. The player itself is the Rust core.
publish_to: none
version: 0.5.2

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  code_assets: ^2.2.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  hooks: ^2.2.0
  material_ui: ^1.10.0

flutter:
  uses-material-design: true
dev_dependencies:
  flutter_lints: ^6.0.0
