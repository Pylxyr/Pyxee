[workspace]
resolver = "2"
members = ["crates/core", "crates/lyrics", "crates/shell", "crates/audio", "crates/sources", "crates/spike", "crates/app", "crates/library", "crates/net", "xtask"]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The Linux build (packaging/arch): the same code as the Windows one, compiled for speed instead of for compile time.
# Whole-program optimisation and one code-generation unit make the program faster and smaller, and the build slower
# (use it with `--profile release-linux`; the Windows installer keeps the default `release` profile).
[profile.release-linux]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Size over speed: the audio work is in FFmpeg (C, built separately) and takes well under 1% of a core, so this costs
# about 8% on the Rust resampler and saves 5 MB of the binary (18.5 -> 13.4 MB when measured).
opt-level = "s"

# souvlaki 0.9.3's MPRIS service (zbus 5, like Tauri's plugins) still wakes every 10 ms for as long as the program runs,
# to look for a message. The copy in vendor/souvlaki is upstream 0.9.3 with one change: it blocks until a message comes
# (src/platform/mpris/zbus.rs). Windows uses a different file of the crate and is not affected.
[patch.crates-io]
souvlaki = { path = "vendor/souvlaki" }
