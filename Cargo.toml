[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "crates/sources", "crates/spike", "crates/app", "crates/library", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
