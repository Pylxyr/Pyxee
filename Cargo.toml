[workspace]
resolver = "3"
members = ["crates/core", "crates/lyrics", "crates/shell", "crates/audio", "crates/sources", "crates/spike", "crates/app", "crates/library", "crates/net", "xtask"]

[workspace.package]
version = "0.7.5"
edition = "2024"
license = "MIT"
rust-version = "1.100"
repository = "https://github.com/Pylxyr/Pyxee"
readme = "README.md"
keywords = ["music", "player", "audio", "youtube", "tauri"]
categories = ["multimedia::audio"]

[workspace.dependencies]
# Versions that more than one crate uses are written here, once; a crate asks for them with `name.workspace = true`
# (and adds its own features: features only ever add up).
pyxee-core = { path = "crates/core" }
pyxee-audio = { path = "crates/audio" }
pyxee-library = { path = "crates/library" }
pyxee-lyrics = { path = "crates/lyrics" }
pyxee-net = { path = "crates/net" }
pyxee-shell = { path = "crates/shell" }
pyxee-sources = { path = "crates/sources" }
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
ureq = "3.5.1"
cpal = "0.18.2"
sha2 = "0.11.1"
ring = "0.17.14"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `multiple_crate_versions` and the manifest checks (the exceptions we cannot fix are listed in clippy.toml).
cargo = { level = "warn", priority = -1 }
# Pedantic lints this project does not follow. Each is a trade-off for application code: `# Errors` / `# Panics`
# sections and `#[must_use]` on internal items, long match-heavy functions, flag structs, short names in numeric code,
# and the casts between sample counts, milliseconds and pixels (their ranges are bounded by what the device and the
# files can hold) are not worth the noise. They are allowed here, once, instead of at the top of every crate; CI runs
# clippy with `-D warnings`, so everything else in the groups above fails the build.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
many_single_char_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# Release builds (the Windows installer and portable zip, the Linux package): fastest program, slowest build.
# - opt-level 3 and no size trade-offs: the resampler, the volume and crossfade mixing and the library queries are tight
#   loops, and the less CPU they use the longer a laptop lasts.
# - Whole-program optimisation (`lto = "fat"`) and one code-generation unit let the compiler inline and vectorise across
#   crates (the player, the sources, the bundled SQLite, the HTTP and TLS code) instead of stopping at every crate boundary.
# - `panic` stays "unwind" on purpose: a panic in the decoder, the audio pipeline, the engine loop or a tag or cover
#   reader is caught (`catch_unwind`) and becomes a skipped song or a notice instead of a dead program. "abort" would be
#   a little smaller and would turn every one of those into a crash.
# - No `target-cpu` here: the installer runs on any x86-64 PC. The Arch package, built on the machine that runs it, adds
#   `-C target-cpu=native` itself (packaging/arch/PKGBUILD).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

# The Linux package (packaging/arch): the release profile above, with the symbols stripped (the same speed, a smaller file).
# Use it with `--profile release-linux`; the Windows installer uses `release`.
[profile.release-linux]
inherits = "release"
strip = "symbols"

# For trying a change in an optimised build without waiting for whole-program optimisation (`--profile release-quick`,
# the program is then in target/release-quick). Not used for anything that is shipped.
[profile.release-quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

# souvlaki 0.9.3's MPRIS service (zbus 5, like Tauri's plugins) still wakes every 10 ms for as long as the program runs,
# to look for a message. The copy in vendor/souvlaki is upstream 0.9.3 with two changes, both in the MPRIS code
# (src/platform/mpris/zbus.rs): it blocks until a message comes, and it publishes the `DesktopEntry` property
# (`PlatformConfig::desktop_entry`) so KDE and GNOME can show Pyxee's icon in their media widgets. Windows uses a
# different file of the crate and is not affected.
[patch.crates-io]
souvlaki = { path = "vendor/souvlaki" }
