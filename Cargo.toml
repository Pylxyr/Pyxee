[workspace]
resolver = "2"
members = ["crates/core", "crates/lyrics", "crates/shell", "crates/audio", "crates/sources", "crates/spike", "crates/app", "crates/library", "crates/net", "xtask"]

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "MIT"
rust-version = "1.100"
repository = "https://github.com/Pylxyr/Pyxee"
readme = "README.md"
keywords = ["music", "player", "audio", "youtube", "tauri"]
categories = ["multimedia::audio"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `multiple_crate_versions` and the manifest checks (the exceptions we cannot fix are listed in clippy.toml).
cargo = { level = "warn", priority = -1 }
# Pedantic lints this project does not follow. Each is a trade-off for application code: `# Errors` / `# Panics`
# sections and `#[must_use]` on internal items, long match-heavy functions, flag structs, short names in numeric code,
# and the casts between sample counts, milliseconds and pixels (their ranges are bounded by what the device and the
# files can hold) are not worth the noise. They are allowed here, once, instead of at the top of every crate; CI runs
# clippy with `-D warnings`, so everything else in the groups above fails the build.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
many_single_char_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"

# The Linux build (packaging/arch): the same code as the Windows one, compiled for speed instead of for compile time.
# Whole-program optimisation and one code-generation unit make the program faster and smaller, and the build slower
# (use it with `--profile release-linux`; the Windows installer keeps the default `release` profile).
[profile.release-linux]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
# Size over speed: the audio work is in FFmpeg (C, built separately) and takes well under 1% of a core, so this costs
# about 8% on the Rust resampler and saves 5 MB of the binary (18.5 -> 13.4 MB when measured).
opt-level = "s"

# souvlaki 0.9.3's MPRIS service (zbus 5, like Tauri's plugins) still wakes every 10 ms for as long as the program runs,
# to look for a message. The copy in vendor/souvlaki is upstream 0.9.3 with two changes, both in the MPRIS code
# (src/platform/mpris/zbus.rs): it blocks until a message comes, and it publishes the `DesktopEntry` property
# (`PlatformConfig::desktop_entry`) so KDE and GNOME can show Pyxee's icon in their media widgets. Windows uses a
# different file of the crate and is not affected.
[patch.crates-io]
souvlaki = { path = "vendor/souvlaki" }
