[workspace]
resolver = "2"
members = ["crates/core", "crates/lyrics", "crates/shell", "crates/audio", "crates/sources", "crates/spike", "crates/app", "crates/library", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The Linux build (packaging/arch): the same code as the Windows one, compiled for speed instead of for compile time.
# Whole-program optimisation and one code-generation unit make the program faster and smaller, and the build slower
# (use it with `--profile release-linux`; the Windows installer keeps the default `release` profile).
[profile.release-linux]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
